# 열쇠(토큰) 점검용 (수동 실행). 길이·앞부분만 출력하고 claude 가 응답하는지 확인
name: diag
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 열쇠 점검
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude --version
          echo "길이: ${#CLAUDE_CODE_OAUTH_TOKEN}"
          echo "앞부분: ${CLAUDE_CODE_OAUTH_TOKEN:0:13}"
          echo "제어문자 수: $(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | LC_ALL=C tr -d '[:print:]' | wc -c)"
          claude -p "reply with the single word ok" 2>&1 | head -5
