# 분석 글 만들기 (GitHub 서버에서 실행 → 맥이 꺼져 있어도 동작). 2026-10-28 공개/비공개 분리:
# 이 저장소(공개)는 글 읽기·다시 쓰기·데이터 대조·이미지 만들기까지만 하고, 완성된 글을 queue 가지에 올린 뒤 등록 쪽에 알린다.
name: prep

on:
  # 30분마다 새 글이 있는지만 가볍게 확인(약 20초)하고, 새 글이 있을 때만 전체 실행. GitHub 시간은 UTC.
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      submit:
        description: "완성된 글을 전달 가지에 올리기 (체크 안 하면 미리보기만)"
        type: boolean
        default: false
      article:
        description: "특정 글 번호 (비우면 최신 글)"
        required: false
      board:
        description: "한 게시판만 (boards.json 의 key, 예: ls_baseball)"
        required: false

permissions:
  contents: write

concurrency:
  group: prep
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 네이버 로그인 넣기 (비밀값)
        env:
          NAVER_SESSION: ${{ secrets.NAVER_SESSION }}
        run: |
          printf '%s' "$NAVER_SESSION" > naver_session.json
          chmod 600 naver_session.json

      - name: 새 글 확인
        id: check
        run: |
          pip install -q requests
          python3 check_new.py

      # ---- 여기부터는 새 글이 있을 때(또는 직접 실행했을 때)만 ----
      - uses: actions/setup-python@v5
        if: steps.check.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: "22"

      - name: 프로그램 설치
        if: steps.check.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          npm install -g @anthropic-ai/claude-code

      - name: 글 만들기
        if: steps.check.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        env:
          HEADLESS: "1"
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          ARGS="--count 3"
          if [ -n "${{ inputs.article }}" ]; then ARGS="--article ${{ inputs.article }}"; fi
          if [ -n "${{ inputs.board }}" ]; then ARGS="$ARGS --board ${{ inputs.board }}"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.submit }}" = "true" ]; then ARGS="$ARGS --submit"; fi
          python -u run_prepare.py $ARGS

      - name: 계속 막힌 글 확인
        if: always() && (github.event_name == 'schedule' || inputs.submit == true) && (steps.check.outputs.new == 'true' || github.event_name == 'workflow_dispatch')
        run: python3 stuck_alert.py

      - name: 처리 기록 저장 (done.json 등)
        if: always() && (steps.check.outputs.new == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"
          python3 save_state.py  # 저장소 최신 기록과 합쳐서 올림, 거부되면 다시 시도

      - name: 완성된 글 전달 (queue 가지)
        id: push
        if: always() && (steps.check.outputs.new == 'true' || github.event_name == 'workflow_dispatch')
        run: python3 push_queue.py

      # 등록 쪽(비공개 저장소)에 알림. 저장소 이름은 비밀값 POST_REPO, 권한 토큰은 DISPATCH_TOKEN
      - name: 등록 쪽 깨우기
        if: always() && steps.push.outputs.staged == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          POST_REPO: ${{ secrets.POST_REPO }}
        run: gh api -X POST "repos/$POST_REPO/actions/workflows/post.yml/dispatches" -f ref=main -f "inputs[from]=prep"
